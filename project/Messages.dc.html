<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',sans-serif;color:#050B20;background:#fff;-webkit-font-smoothing:antialiased}
a{color:#050B20;text-decoration:none}a:hover{color:#405FF2}
input{font-family:'Manrope',sans-serif}
</style>
</helmet>
<div data-screen-label="Messages" style="display:flex;flex-direction:column;height:100vh">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid #EEF0F4;background:#fff;flex-shrink:0">
    <a href="Landing.dc.html" style="font-size:20px;font-weight:800;letter-spacing:-0.5px">Auto<span style="color:#405FF2">Rinka</span></a>
    <nav style="display:flex;gap:28px;font-size:14px;font-weight:600">
      <a href="Browse.dc.html">Browse</a><a href="Sell.dc.html">Sell</a><a href="Pricing.dc.html">Pricing</a><a href="Dashboard.dc.html">Dashboard</a><a href="Messages.dc.html" style="color:#405FF2">Messages</a>
    </nav>
    <span style="width:34px;height:34px;border-radius:99px;background:#E9F2FF;color:#405FF2;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center">TK</span>
  </header>
  <div style="flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0">
    <!-- Thread list -->
    <aside style="border-right:1px solid #EEF0F4;overflow-y:auto">
      <div style="padding:20px 22px 12px;font-size:17px;font-weight:800">Messages</div>
      <sc-for list="{{ threads }}" as="t" hint-placeholder-count="4">
        <div onClick="{{ t.pick }}" style="display:flex;gap:12px;padding:14px 22px;cursor:pointer;background:{{ t.bg }};border-left:{{ t.accent }}">
          <span style="width:52px;height:40px;border-radius:8px;background:{{ t.photo }};flex-shrink:0"></span>
          <div style="flex:1;min-width:0">
            <div style="display:flex;justify-content:space-between;gap:8px">
              <span style="font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.name }}</span>
              <span style="font-size:11px;color:#9AA1AC;font-weight:600;flex-shrink:0">{{ t.time }}</span>
            </div>
            <div style="font-size:12px;color:#50565E;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.car }}</div>
            <div style="font-size:12px;color:{{ t.previewColor }};font-weight:{{ t.previewWeight }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.preview }}</div>
          </div>
          <sc-if value="{{ t.unread }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:99px;background:#405FF2;align-self:center;flex-shrink:0"></span></sc-if>
        </div>
      </sc-for>
    </aside>
    <!-- Conversation -->
    <main style="display:flex;flex-direction:column;min-height:0">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 26px;border-bottom:1px solid #EEF0F4;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:56px;height:42px;border-radius:8px;background:{{ activePhoto }}"></span>
          <div>
            <div style="font-size:14.5px;font-weight:800">{{ activeName }}</div>
            <a href="{{ activeHref }}" style="font-size:12.5px;color:#405FF2;font-weight:700">{{ activeCar }} · {{ activePrice }} ↗</a>
          </div>
        </div>
        <span style="font-size:12px;color:#2BB673;font-weight:700">● Online</span>
      </div>
      <div style="flex:1;overflow-y:auto;padding:24px 26px;display:flex;flex-direction:column;gap:12px;background:#FAFBFC">
        <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="5">
          <div style="align-self:{{ m.align }};max-width:62%;background:{{ m.bg }};color:{{ m.fg }};border-radius:{{ m.radius }};padding:11px 16px;font-size:13.5px;line-height:1.55;font-weight:500">
            {{ m.body }}
            <div style="font-size:10.5px;opacity:.6;margin-top:4px;text-align:right">{{ m.time }}</div>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;gap:10px;padding:16px 26px;border-top:1px solid #EEF0F4;flex-shrink:0">
        <input value="{{ draft }}" onChange="{{ setDraft }}" onKeyDown="{{ onKey }}" placeholder="Write a message…" style="flex:1;border:1px solid #E1E4EB;border-radius:12px;padding:13px 16px;font-size:14px;outline:none">
        <span onClick="{{ send }}" style="background:#405FF2;color:#fff;font-size:14px;font-weight:700;border-radius:12px;padding:13px 26px;cursor:pointer;display:flex;align-items:center">Send</span>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: null, active: 0, draft: "", extra: {} };
  componentDidMount() {
    import("./data.js").then(d => {
      const lid = Number(new URLSearchParams(window.location.search).get("listing"));
      const idx = lid ? Math.max(0, this.threadDefs(d).findIndex(t => t.l.id === lid)) : 0;
      this.setState({ data: d, active: idx });
    });
  }
  threadDefs(d) {
    return [
      { l: d.LISTINGS[0], name: "Baltic Auto Group", time: "10:24", unread: true, msgs: [
        ["them", "Hello! Yes, the 530d is still available. Would you like to arrange a viewing?", "09:58"],
        ["me", "Hi! Great — is the service history complete? And is the price negotiable?", "10:05"],
        ["them", "Full history at BMW Vilnius, I can send the invoices. Small room on price for a quick deal.", "10:11"],
        ["them", "We're open until 19:00 today if you want to stop by.", "10:24"]] },
      { l: d.LISTINGS[2], name: "Rūta B.", time: "Yesterday", unread: true, msgs: [
        ["me", "Hi, does the RAV4 have a tow hitch?", "14:02"],
        ["them", "No hitch, but it has the factory wiring prep. Never towed anything.", "16:40"]] },
      { l: d.LISTINGS[4], name: "Mindaugas P.", time: "Tue", unread: false, msgs: [
        ["them", "The Octavia is sold, sorry! I'll mark it as sold today.", "11:12"],
        ["me", "No problem, thanks for letting me know.", "11:30"]] },
      { l: d.LISTINGS[8], name: "Eglė S.", time: "Mon", unread: false, msgs: [
        ["me", "Is the Tucson still under factory warranty?", "18:20"],
        ["them", "Yes, until 2028 or 100k km. First registered 03/2023.", "19:02"]] }
    ];
  }
  renderVals() {
    const { data, active, draft, extra } = this.state;
    const defs = data ? this.threadDefs(data) : [];
    const t = defs[active];
    const allMsgs = t ? [...t.msgs, ...(extra[active] || [])] : [];
    return {
      threads: defs.map((th, i) => {
        const last = [...th.msgs, ...(extra[i] || [])].slice(-1)[0];
        return {
          name: th.name, time: th.time, unread: th.unread && i !== active,
          car: th.l.make + " " + th.l.model + " – " + th.l.year,
          preview: (last[0] === "me" ? "You: " : "") + last[1],
          previewColor: th.unread && i !== active ? "#050B20" : "#9AA1AC",
          previewWeight: th.unread && i !== active ? 700 : 500,
          photo: data.stripe(th.l.id),
          bg: i === active ? "#F5F8FF" : "#fff",
          accent: i === active ? "3px solid #405FF2" : "3px solid transparent",
          pick: () => this.setState({ active: i })
        };
      }),
      activeName: t ? t.name : "", activeCar: t ? t.l.make + " " + t.l.model : "",
      activePrice: t && data ? data.fmtPrice(t.l.price) : "",
      activePhoto: t && data ? data.stripe(t.l.id) : "#EEF0F4",
      activeHref: t ? "Listing.dc.html?id=" + t.l.id : "#",
      msgs: allMsgs.map(([who, body, time]) => ({
        body, time,
        align: who === "me" ? "flex-end" : "flex-start",
        bg: who === "me" ? "#405FF2" : "#fff", fg: who === "me" ? "#fff" : "#050B20",
        radius: who === "me" ? "14px 14px 4px 14px" : "14px 14px 14px 4px"
      })),
      draft,
      setDraft: e => this.setState({ draft: e.target.value }),
      onKey: e => { if (e.key === "Enter") this.doSend(); },
      send: () => this.doSend()
    };
  }
  doSend() {
    const { draft, active, extra } = this.state;
    if (!draft.trim()) return;
    const now = new Date();
    const time = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    this.setState({ extra: { ...extra, [active]: [...(extra[active] || []), ["me", draft.trim(), time]] }, draft: "" });
  }
}
</script>
</body>
</html>
