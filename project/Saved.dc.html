<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',sans-serif;color:#050B20;background:#fff;-webkit-font-smoothing:antialiased}
a{color:#050B20;text-decoration:none}a:hover{color:#405FF2}
</style>
</helmet>
<div data-screen-label="Saved listings">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid #EEF0F4;background:#fff">
    <a href="Landing.dc.html" style="font-size:20px;font-weight:800;letter-spacing:-0.5px">Auto<span style="color:#405FF2">Rinka</span></a>
    <nav style="display:flex;gap:28px;font-size:14px;font-weight:600">
      <a href="Browse.dc.html">Browse</a><a href="Sell.dc.html">Sell</a><a href="Pricing.dc.html">Pricing</a><a href="Dashboard.dc.html">Dashboard</a><a href="Messages.dc.html">Messages</a>
    </nav>
    <span style="width:34px;height:34px;border-radius:99px;background:#E9F2FF;color:#405FF2;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center">TK</span>
  </header>
  <div style="max-width:1160px;margin:0 auto;padding:40px 40px 80px">
    <h1 style="font-size:28px;font-weight:800;letter-spacing:-0.7px;margin:0 0 4px">Saved listings</h1>
    <p style="font-size:13.5px;color:#50565E;font-weight:600;margin:0 0 28px">{{ count }} cars · we'll notify you if a price drops</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
        <div style="border:1px solid #E1E4EB;border-radius:16px;overflow:hidden;background:#fff">
          <a href="{{ c.href }}" style="display:block;position:relative;height:150px;background:{{ c.photo }}">
            <span style="position:absolute;bottom:8px;left:12px;font-family:monospace;font-size:10.5px;color:#7A8494">photo: {{ c.photoLabel }}</span>
            <sc-if value="{{ c.drop }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:10px;left:10px;background:#2BB673;color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:5px 12px">Price dropped</span></sc-if>
          </a>
          <div style="padding:16px 18px 18px">
            <a href="{{ c.href }}" style="font-size:15.5px;font-weight:800;display:block;margin-bottom:2px">{{ c.title }}</a>
            <div style="font-size:12.5px;color:#50565E;font-weight:600;margin-bottom:12px">{{ c.subtitle }}</div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:17px;font-weight:800">{{ c.price }}</span>
              <span onClick="{{ c.remove }}" style="font-size:12.5px;font-weight:700;color:#B4232A;cursor:pointer">Remove</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center;padding:70px 0;color:#50565E">
        <div style="font-size:17px;font-weight:800;color:#050B20;margin-bottom:6px">No saved cars</div>
        <a href="Browse.dc.html" style="display:inline-block;margin-top:10px;background:#405FF2;color:#fff;font-size:13.5px;font-weight:700;border-radius:10px;padding:11px 22px" style-hover="background:#2E4AD9;color:#fff">Browse cars</a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: null, removed: [] };
  componentDidMount() { import("./data.js").then(d => this.setState({ data: d })); }
  renderVals() {
    const { data, removed } = this.state;
    const ids = [1, 3, 6, 11, 18, 23].filter(id => !removed.includes(id));
    const cards = data ? ids.map(id => {
      const l = data.getListing(id);
      return {
        href: "Listing.dc.html?id=" + id, photo: data.stripe(id), photoLabel: l.make + " " + l.model,
        title: l.make + " " + l.model + " – " + l.year,
        subtitle: data.fmtKm(l.km) + " · " + l.fuel + " · " + l.city,
        price: data.fmtPrice(l.price), drop: !!l.oldPrice,
        remove: () => this.setState({ removed: [...removed, id] })
      };
    }) : [];
    return { cards, count: cards.length, empty: data && cards.length === 0 };
  }
}
</script>
</body>
</html>
